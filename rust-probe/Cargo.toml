[package]
name = "header-probe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "header-probe"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "gzip", "brotli", "stream"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
once_cell = "1"
parking_lot = "0.12"
csv = "1"
regex = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
